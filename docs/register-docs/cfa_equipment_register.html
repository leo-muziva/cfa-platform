      function itemDetail(item) {
        const t = TYPES[item.type];
        if (!t) return "—";
        const parts = [];
        if (t.size && item.size) parts.push(item.size);
        if (t.hand && item.hand) parts.push(item.hand);
        return parts.join(" · ") || "—";
      }

      function nextCode(typeName, items) {
        const prefix = TYPES[typeName]?.prefix;
        if (!prefix) return "";
        const nums = items
          .filter((i) => i.code.startsWith(prefix))
          .map((i) => parseInt(i.code.slice(prefix.length)) || 0);
        return (
          prefix +
          String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0")
        );
      }

      function exportCSV(items) {
        const header = [
          "Code",
          "Type",
          "Size",
          "Hand",
          "Condition",
          "Status",
          "Notes",
        ];
        const rows = items.map((i) => [
          i.code,
          i.type,
          i.size || "",
          i.hand || "",
          i.condition,
          i.status,
          (i.notes || "").replace(/,/g, ";"),
        ]);
        const csv = [header, ...rows].map((r) => r.join(",")).join("\n");
        const a = document.createElement("a");
        a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
        a.download = "cfa-equipment.csv";
        a.click();
      }

      const BLANK = {
        type: "",
        code: "",
        hand: "",
        size: "",
        condition: "Good",
        status: "In Storage",
        notes: "",

      const STORE_KEY = "cfa-equipment-register-v2";

              marginRight: 5,

            }}

      }

      function App() {
        const [items, setItems] = useState(null);
        const [loading, setLoading] = useState(true);
        const [expanded, setExpanded] = useState(new Set());
        const [modal, setModal] = useState(false);
        const [editing, setEditing] = useState(null);

          q: "",
          status: "",
          condition: "",

        useEffect(() => {
          try {
            const s = localStorage.getItem(STORE_KEY);
            setItems(s ? JSON.parse(s) : SEED);
            if (!s) localStorage.setItem(STORE_KEY, JSON.stringify(SEED));
          } catch {
            setItems(SEED);
          }
          setLoading(false);
        }, []);

        function persist(next) {
          setItems(next);
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(next));
          } catch {}
        }

        const anyFilter = !!(filters.q || filters.status || filters.condition);

        const filteredItems = useMemo(() => {
          if (!items) return [];
          return items.filter((i) => {
            const q = filters.q.toLowerCase();
            if (
              q &&
              !i.code.toLowerCase().includes(q) &&
              !i.type.toLowerCase().includes(q) &&
              !itemDetail(i).toLowerCase().includes(q) &&
              !(i.notes || "").toLowerCase().includes(q)
            )
              return false;
            if (filters.status && i.status !== filters.status) return false;
            if (filters.condition && i.condition !== filters.condition)
              return false;
            return true;
          });
        }, [items, filters]);

        const activeTypes = useMemo(
          () =>
            TYPE_ORDER.filter((n) => (items || []).some((i) => i.type === n)),
          [items],
        );

          !anyFilter &&
          activeTypes.length > 0 &&
          activeTypes.every((n) => expanded.has(n));

            repair: (items || []).filter((i) => i.status === "Awaiting Repair")
              .length,

          [items],

        const tinfo = form.type ? TYPES[form.type] : null;

        function openAdd() {
          setEditing(null);
          setForm(BLANK);
          setFormErr("");
          setModal(true);
        }
        function openEdit(it) {
          setEditing(it);
          setForm({ ...it });
          setFormErr("");
          setModal(true);
        }
        function closeModal() {
          setModal(false);
          setEditing(null);
        }

        function changeType(type) {
          setForm((f) => ({
            ...BLANK,
            type,
            code: type ? nextCode(type, items) : "",
          }));
          setFormErr("");
        }

        function save() {
          if (!form.type || !form.code.trim()) {
            setFormErr("Type and code are required.");
            return;
          }
          const t = TYPES[form.type];
          if (t.size && !form.size) {
            setFormErr("Select a size.");
            return;
          }
          if (t.hand && !form.hand) {
            setFormErr("Select handedness.");
            return;
          }
          const code = form.code.trim().toUpperCase();
          if (items.some((i) => i.code === code && i.id !== editing?.id)) {
            setFormErr(`Code "${code}" is already in use.`);
            return;
          }
          const item = { ...form, code, id: editing?.id ?? Date.now() };
          persist(
            editing
              ? items.map((i) => (i.id === editing.id ? item : i))
              : [...items, item],
          );
          closeModal();
        }

        function del(id) {
          persist(items.filter((i) => i.id !== id));
          setDelTarget(null);
        }

                    <h1

                      Equipment Register
                    </h1>
                  </div>
                  <div
                    style={{
                      display: "flex",
                      gap: 8,
                      alignItems: "center",
                      paddingTop: 2,
                    }}
                  >
                    <button
                      onClick={() => exportCSV(items)}
                      style={{
                        background: "transparent",
                        border: "1px solid rgba(255,255,255,0.2)",
                        color: "rgba(255,255,255,0.65)",
                        padding: "6px 14px",
                        cursor: "pointer",
                        fontSize: 12,
                        borderRadius: 2,
                      }}
                    >
                      Export CSV
                    </button>
                    <button
                      onClick={openAdd}
                      style={{
                        background: "#C49A1C",
                        border: "none",
                        color: "white",
                        padding: "7px 16px",
                        cursor: "pointer",
                        fontSize: 12,
                        fontWeight: 700,
                        borderRadius: 2,
                      }}
                    >
                      + Add item
                    </button>
                  </div>
                </div>
                <div
                  style={{
                    display: "flex",
                    gap: 20,
                    marginTop: 12,
                    fontSize: 12,
                    flexWrap: "wrap",
                  }}
                >
                  <span style={{ color: "rgba(255,255,255,0.4)" }}>
                    {totals.all} items
                  </span>
                  {[
                    ["In Storage", totals.storage, "#4ADE80"],
                    ["With Member", totals.member, "#FCD34D"],

                                              color:
                                                STATUS_COLOR[item.status] ||
                                                "#5A5248",
                                            }}
                                          >
                                            <Dot
                                              color={STATUS_COLOR[item.status]}
                                            />
                                            {item.status}
                                          </span>
                                        </td>
                                        <td
                                          style={{
                                            ...S.td,
                                            color: "#A89880",
                                            maxWidth: 200,
                                            overflow: "hidden",
                                            textOverflow: "ellipsis",
                                            whiteSpace: "nowrap",
                                          }}
                                        >
                                          {item.notes || "—"}
                                        </td>
                                        <td
                                          style={{
                                            ...S.td,
                                            textAlign: "right",
                                            whiteSpace: "nowrap",
                                          }}
                                        >
                                          <button
                                            onClick={() => openEdit(item)}
                                            style={{
                                              ...S.btnGh,
                                              color: "#1D4ED8",
                                              marginRight: 12,
                                            }}
                                          >
                                            Edit
                                          </button>
                                          <button
                                            onClick={() => setDelTarget(item)}
                                            style={{
                                              ...S.btnGh,
                                              color: "#B91C1C",
                                            }}
                                          >
                                            Delete
                                          </button>
                                        </td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))
              )}

              {anyFilter && (
                <div
                  style={{
                    marginTop: 12,
                    fontSize: 12,
                    color: "#9CA3AF",
                    textAlign: "right",
                  }}
                >
                  {filteredItems.length} of {(items || []).length} items match
                </div>
              )}
            </main>

            {/* ADD / EDIT MODAL */}
            {modal && (
              <div
                style={{
                  position: "fixed",
                  inset: 0,
                  background: "rgba(7,14,27,0.65)",
                  display: "flex",
                  alignItems: "flex-start",
                  justifyContent: "center",
                  paddingTop: 56,
                  zIndex: 50,
                }}
                onClick={(e) => e.target === e.currentTarget && closeModal()}
              >
                <div
                  style={{
                    background: "white",
                    width: "100%",
                    maxWidth: 440,
                    maxHeight: "88vh",
                    overflow: "auto",
                    borderRadius: 3,
                    boxShadow: "0 24px 60px rgba(7,14,27,0.4)",
                  }}
                >
                  <div
                    style={{
                      background: "#0B1F3A",
                      padding: "15px 20px",
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      position: "sticky",
                      top: 0,
                      zIndex: 1,
                    }}
                  >
                    <span
                      style={{
                        color: "white",
                        fontWeight: 700,
                        fontSize: 14,
                        letterSpacing: "0.02em",
                      }}
                    >
                      {editing ? `Edit ${editing.code}` : "Add equipment item"}
                    </span>
                    <button
                      onClick={closeModal}
                      style={{
                        background: "none",
                        border: "none",
                        color: "rgba(255,255,255,0.5)",
                        fontSize: 22,
                        cursor: "pointer",
                        lineHeight: 1,
                        padding: "0 2px",
                      }}
                    >
                      ×
                    </button>
                  </div>
                  <div
                    style={{
                      padding: "20px",
                      display: "flex",
                      flexDirection: "column",
                      gap: 16,
                    }}
                  >
                    <div>
                      <label style={S.label}>Equipment type</label>
                      <select
                        value={form.type}
                        onChange={(e) => !editing && changeType(e.target.value)}
                        disabled={!!editing}
                        style={{
                          ...S.input,
                          opacity: editing ? 0.65 : 1,
                          cursor: editing ? "default" : "pointer",
                        }}
                      >
                        <option value="">Select type…</option>
                        {TYPE_ORDER.map((t) => (
                          <option key={t}>{t}</option>
                        ))}
                      </select>
                    </div>
                    {form.type && (
                      <>
                        <div>
                          <label style={S.label}>Item code</label>
                          <input
                            type="text"
                            value={form.code}
                            onChange={(e) =>
                              setForm((f) => ({
                                ...f,
                                code: e.target.value.toUpperCase(),
                              }))
                            }
                            style={{
                              ...S.input,
                              fontFamily: "Consolas,Monaco,monospace",
                            }}
                            placeholder="e.g. WF001"
                          />
                          <p
                            style={{
                              margin: "5px 0 0",
                              fontSize: 11,
                              color: "#A89880",
                            }}
                          >
                            Auto-generated — override if needed.
                          </p>
                        </div>
                        {tinfo?.size && (
                          <div>
                            <label style={S.label}>Size</label>
                            <div style={{ display: "flex", gap: 6 }}>
                              {SIZES.map((s) => (
                                <button
                                  key={s}
                                  onClick={() =>
                                    setForm((f) => ({ ...f, size: s }))
                                  }
                                  style={{
                                    flex: 1,
                                    padding: "7px 0",
                                    cursor: "pointer",
                                    fontSize: 12,
                                    fontWeight: 600,
                                    border:
                                      form.size === s
                                        ? "2px solid #C49A1C"
                                        : "1px solid #D5CFC5",
                                    background:
                                      form.size === s ? "#C49A1C" : "white",
                                    color:
                                      form.size === s ? "white" : "#5A5248",
                                    borderRadius: 2,
                                  }}
                                >
                                  {s}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                        {tinfo?.hand && (
                          <div>
                            <label style={S.label}>Handedness</label>
                            <div style={{ display: "flex", gap: 8 }}>
                              {["Right", "Left"].map((h) => (
                                <button
                                  key={h}
                                  onClick={() =>
                                    setForm((f) => ({ ...f, hand: h }))
                                  }
                                  style={{
                                    flex: 1,
                                    padding: "9px 0",
                                    cursor: "pointer",
                                    fontSize: 13,
                                    border:
                                      form.hand === h
                                        ? "2px solid #C49A1C"
                                        : "1px solid #D5CFC5",
                                    background:
                                      form.hand === h ? "#C49A1C" : "white",
                                    color:
                                      form.hand === h ? "white" : "#5A5248",
                                    borderRadius: 2,
                                  }}
                                >
                                  {h}-handed
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                        <div
                          style={{
                            display: "grid",
                            gridTemplateColumns: "1fr 1fr",
                            gap: 12,
                          }}
                        >
                          {[
                            ["Condition", "condition", CONDITIONS],
                            ["Status", "status", STATUSES],
                          ].map(([lbl, key, opts]) => (
                            <div key={key}>
                              <label style={S.label}>{lbl}</label>
                              <select
                                value={form[key]}
                                onChange={(e) =>
                                  setForm((f) => ({
                                    ...f,
                                    [key]: e.target.value,
                                  }))
                                }
                                style={{ ...S.input, cursor: "pointer" }}
                              >
                                {opts.map((o) => (
                                  <option key={o}>{o}</option>
                                ))}
                              </select>
                            </div>
                          ))}
                        </div>
                        <div>
                          <label style={S.label}>
                            Notes{" "}
                            <span style={{ fontWeight: 400, color: "#A89880" }}>
                              (optional)
                            </span>
                          </label>
                          <textarea
                            value={form.notes}
                            onChange={(e) =>
                              setForm((f) => ({ ...f, notes: e.target.value }))
                            }
                            rows={2}
                            placeholder="Any notes about this item…"
                            style={{
                              ...S.input,
                              resize: "vertical",
                              minHeight: 56,
                            }}
                          />
                        </div>
                      </>
                    )}
                    {formErr && (
                      <p
                        style={{
                          margin: 0,
                          fontSize: 12,
                          color: "#B91C1C",
                          background: "#FEF2F2",
                          border: "1px solid #FECACA",
                          borderRadius: 2,
                          padding: "8px 12px",
                        }}
                      >
                        {formErr}
                      </p>
                    )}
                  </div>
                  <div
                    style={{
                      padding: "12px 20px",
                      borderTop: "1px solid #EAE6DF",
                      display: "flex",
                      justifyContent: "flex-end",
                      gap: 8,
                      position: "sticky",
                      bottom: 0,
                      background: "white",
                    }}
                  >
                    <button onClick={closeModal} style={S.btnOut}>
                      Cancel
                    </button>
                    <button
                      onClick={save}
                      disabled={!form.type}
                      style={{
                        ...S.btnGold,
                        opacity: form.type ? 1 : 0.45,
                        cursor: form.type ? "pointer" : "not-allowed",
                      }}
                    >
                      {editing ? "Save changes" : "Add item"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* DELETE CONFIRM */}
            {delTarget && (
              <div
                style={{
                  position: "fixed",
                  inset: 0,
                  background: "rgba(7,14,27,0.65)",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  zIndex: 50,
                  padding: "0 16px",
                }}
              >
                <div
                  style={{
                    background: "white",
                    width: "100%",
                    maxWidth: 380,
                    borderRadius: 3,
                    padding: 24,
                    boxShadow: "0 24px 60px rgba(7,14,27,0.4)",
                  }}
                >
                  <p
                    style={{
                      margin: "0 0 6px",
                      fontWeight: 700,
                      fontSize: 16,
                      color: "#0B1F3A",
                    }}
                  >
                    Delete {delTarget.code}?
                  </p>
                  <p
                    style={{
                      margin: "0 0 20px",
                      fontSize: 13,
                      color: "#7A7265",
                      lineHeight: 1.55,
                    }}
                  >
                    Permanently removes this{" "}
                    <strong style={{ color: "#0B1F3A" }}>
                      {delTarget.type}
                    </strong>
                    {itemDetail(delTarget) !== "—"
                      ? ` (${itemDetail(delTarget)})`
                      : ""}{" "}
                    from the register.
                  </p>
                  <div
                    style={{
                      display: "flex",
                      justifyContent: "flex-end",
                      gap: 8,
                    }}
                  >
                    <button onClick={() => setDelTarget(null)} style={S.btnOut}>
                      Cancel
                    </button>
                    <button
                      onClick={() => del(delTarget.id)}
                      style={{ ...S.btnGold, background: "#B91C1C" }}
                    >
                      Delete
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>

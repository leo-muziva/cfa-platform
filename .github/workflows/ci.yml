# Continuous Integration for the CFA Platform.
#
# GitHub runs this automatically on a fresh Ubuntu machine every time someone
# opens or updates a pull request into `develop` or `main`. It runs the same
# three checks the ticket workflow in CLAUDE.md asks for before pushing:
#
#   1. lint   - code style and common mistakes
#   2. test   - the Vitest suite (services, validation, migrations, seed data)
#   3. build  - the production Next.js build, which is what catches type errors
#
# If any of them fail, the pull request shows a red X and the logs explain why.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    env:
      # The build never contacts Supabase: every page that reads data is
      # server-rendered on demand, so nothing is fetched at build time.
      # These placeholders exist only because the config validator in
      # lib/supabase/config.ts requires a well-formed URL and key to be present.
      # Real credentials live in Vercel and are never needed here.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs the exact versions in package-lock.json, unlike
      # `npm install` which may quietly upgrade them. This is what makes the
      # run reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `vitest run` rather than `npm test`: the `test` script starts Vitest in
      # watch mode, which would wait for file changes forever on a CI machine.
      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
